name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Istanbul

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  test:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chrome"]' || '["chrome","firefox"]') }}
    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps "$BROWSER"
      - run: npm test -- --project="$BROWSER"

      - name: Generate Allure HTML
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: npm run report:allure:generate

      - name: Upload HTML reports
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}
          path: |
            playwright-report/
            allure-report/
          retention-days: 14

  notify-slack:
    name: Notify Slack
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && vars.SPARKROCK_SLACK_REPORTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Post test results and report links to Slack
        env:
          SPARKROCK_SLACK_REPORTS_ENABLED: ${{ vars.SPARKROCK_SLACK_REPORTS_ENABLED }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
        run: node scripts/send-slack-message.mjs
