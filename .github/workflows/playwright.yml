name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
      timezone: Europe/Istanbul

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  test:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chrome"]' || '["chrome","firefox"]') }}
    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx playwright install --with-deps "$BROWSER"
      - run: npm test -- --project="$BROWSER"

      - name: Generate Allure HTML
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: npm run report:allure:generate

      - name: Upload HTML reports
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}
          path: |
            playwright-report/
            allure-report/
          retention-days: 14

  notify-slack:
    name: Notify Slack
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' && vars.SPARKROCK_SLACK_REPORTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    steps:
      - name: Post test results and report links to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSERS: ${{ github.event_name == 'schedule' && 'Chrome' || 'Chrome, Firefox' }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo 'Slack notification skipped. Configure the SLACK_WEBHOOK_URL repository secret to enable it.'
            exit 0
          fi

          message=$(printf '*Sparkrock Playwright E2E* · *%s*\nTrigger: %s · Browsers: %s\n<%s|Workflow run>' \
            "$TEST_RESULT" "$GITHUB_EVENT_NAME" "$BROWSERS" "$RUN_URL")

          if artifacts=$(curl --fail --silent --show-error --max-time 15 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"); then
            report_links=$(jq -r --arg run "$RUN_URL" '
              .artifacts[]
              | select(.expired == false and (.name == "reports-chrome" or .name == "reports-firefox"))
              | "<\($run)/artifacts/\(.id)|\(.name) · Playwright and Allure>"
            ' <<< "$artifacts")
            if [[ -n "$report_links" ]]; then
              message=$(printf '%s\n%s' "$message" "$report_links")
            fi
          else
            echo '::warning::Unable to look up report artifacts. The Slack summary will link to the workflow run.'
          fi

          payload=$(jq -n --arg text "$message" '{text: $text}')
          curl --fail --silent --show-error --max-time 15 --output /dev/null \
            --header 'Content-Type: application/json' --data "$payload" -- "$SLACK_WEBHOOK_URL"
          echo 'Slack notification delivered.'
